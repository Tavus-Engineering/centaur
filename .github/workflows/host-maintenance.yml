name: Host maintenance

on:
  pull_request:
    paths:
      - Makefile
      - contrib/scripts/host-disk-cleanup*
      - contrib/systemd/**
      - .github/workflows/host-maintenance.yml

permissions:
  contents: read

jobs:
  disk-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell syntax
        run: bash -n contrib/scripts/host-disk-cleanup.sh contrib/scripts/host-disk-cleanup.test.sh
      - name: Check cleanup safety and disk headroom
        run: make test-host-cleanup
