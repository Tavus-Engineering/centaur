[project]
name = "watch-agent-integration-tools"
description = "Health and fallback access for Watch Agent hosted integrations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
braintrust = "centaur_tool_integrations.cli:braintrust_app"
coda = "centaur_tool_integrations.cli:coda_app"
github = "centaur_tool_integrations.cli:github_app"
logrocket = "centaur_tool_integrations.cli:logrocket_app"

[tool.hatch.build.targets.wheel]
packages = ["centaur_tool_integrations"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "centaur_tool_integrations/client.py"
timeout_s = 600
secrets = [
    {type = "http", name = "BRAINTRUST_API_KEY", match_headers = ["Authorization"], hosts = ["api.braintrust.dev"]},
    {type = "http", name = "CODA_API_KEY", match_headers = ["Authorization"], hosts = ["docs.superhuman.com"]},
    {type = "http", name = "GITHUB_TOKEN", match_headers = ["Authorization"], hosts = ["api.github.com"]},
    {type = "http", name = "LOGROCKET_API_TOKEN", match_headers = ["Authorization"], hosts = ["mcp.logrocket.com"]},
]
