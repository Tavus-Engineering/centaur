model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
model_verbosity = "low"
service_tier = "flex"
approval_policy = "never"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true
project_doc_max_bytes = 131072

[features]
goals = true
fast_mode = false
memories = true
hooks = true
multi_agent = false
multi_agent_v2 = false
enable_fanout = false
runtime_metrics = true

[agents]
max_depth = 1
job_max_runtime_seconds = 900

[tools]
view_image = true

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[model_providers.responses]
# The name "azure" is load-bearing, not cosmetic: codex strips the `id` field
# from Responses input items (`#[serde(skip_serializing)]` on ResponseItem ids)
# and only re-attaches them via `attach_item_ids` when
# `is_azure_responses_provider(name, base_url)` matches — i.e. name == "azure"
# or an Azure base URL. Meta's Responses endpoint, like Azure's, rejects
# replayed history items without ids (`input[N] missing required field id`),
# so long --meta turns fail once the model round-trips its own prior
# reasoning/tool items. Rename back to a display name once we're on
# codex >= 0.142.0 with `[features] item_ids = true`, which preserves ids for
# all Responses providers.
name = "azure"
base_url = "https://api.ai.meta.com/v1"
env_key = "META_AI_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# These hosted MCP servers mirror the connector surfaces available in the
# local Codex app. They are optional so deployments without a matching secret
# grant still start; configured deployments fail their explicit tool-health
# smoke instead of silently treating an upstream credential check as access.
[mcp_servers.Coda]
url = "https://docs.superhuman.com/apis/mcp"
bearer_token_env_var = "CODA_API_KEY"
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.braintrust]
url = "https://api.braintrust.dev/mcp"
bearer_token_env_var = "BRAINTRUST_API_KEY"
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.logrocket]
url = "https://mcp.logrocket.com/mcp"
bearer_token_env_var = "LOGROCKET_API_TOKEN"
required = false
startup_timeout_sec = 20
tool_timeout_sec = 600

[mcp_servers.signoz]
url = "https://mcp.us.signoz.cloud/mcp"
env_http_headers = { "SIGNOZ-API-KEY" = "SIGNOZ_API_KEY", "X-SigNoz-URL" = "SIGNOZ_URL" }
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

[projects."/"]
trust_level = "trusted"
